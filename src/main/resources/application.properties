spring.application.name=CarSalesPlatform
server.port=8080

# JSP configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Data directory (relative to project root)
app.data.directory=data

# When true, new listings are hidden until an admin approves. When false, listings go live on Browse immediately.
app.listings.require-admin-approval=true

# Application metadata
app.name=AutoMart - Second-Hand Car Sales Platform
app.version=1.0.0
